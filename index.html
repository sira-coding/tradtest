<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doggy AI Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d1117; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 24px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
        .header { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 22px; font-weight: bold; color: #58a6ff; margin-bottom: 20px; }
        .status-badge { padding: 12px; border-radius: 30px; font-weight: bold; margin-bottom: 20px; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .status-running { background: rgba(46, 160, 67, 0.15); border: 1px solid #2ea043; color: #3fb950; }
        .status-stopped { background: rgba(248, 81, 73, 0.15); border: 1px solid #f85149; color: #f85149; }
        .metric-box { background: #21262d; border-radius: 12px; padding: 16px; margin-bottom: 12px; text-align: left; }
        .metric-title { font-size: 12px; color: #8b949e; text-transform: uppercase; margin-bottom: 6px; }
        .metric-value { font-size: 24px; font-weight: bold; }
        .profit-positive { color: #3fb950; }
        .profit-negative { color: #f85149; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        button { border: none; border-radius: 10px; padding: 14px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; color: #fff; }
        .btn-start { background: #238636; }
        .btn-start:hover { background: #2ea043; }
        .btn-stop { background: #da3633; }
        .btn-stop:hover { background: #f85149; }
        .footer { font-size: 11px; color: #8b949e; margin-top: 16px; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <span>🐶 Doggy AI Control</span>
    </div>

    <div id="statusBadge" class="status-badge status-running">
        <span id="statusDot">🟢</span> <span id="statusText">บอทกำลังทำงาน (RUNNING)</span>
    </div>

    <div class="metric-box">
        <div class="metric-title">📊 กำไร/ขาดทุนสะสม (PROFIT)</div>
        <div id="totalProfit" class="metric-value profit-positive">+$0.00</div>
    </div>

    <div class="grid-2">
        <div class="metric-box">
            <div class="metric-title">📚 MARTINGALE STEP</div>
            <div id="martStep" class="metric-value">0 / 5</div>
        </div>
        <div class="metric-box">
            <div class="metric-title">📈 LOT ถัดไป</div>
            <div id="nextLot" class="metric-value">0.01</div>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn-start" onclick="sendCommand('start')">▶ START</button>
        <button class="btn-stop" onclick="sendCommand('stop')">■ STOP</button>
    </div>

    <div class="footer">
        อัปเดตล่าสุด: <span id="lastUpdate">N/A</span> | Error: <span id="lastErr">None</span>
    </div>
</div>

<script>
    // URL ของ ngrok ของคุณ
    const SERVER_URL = "https://equinox-swipe-jelly.ngrok-free.dev";

    async function sendCommand(cmd) {
        try {
            const res = await fetch(`${SERVER_URL}/${cmd}`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'ngrok-skip-browser-warning': 'true'
                }
            });
            const data = await res.json();
            updateUI(data);
            fetchMetrics();
        } catch (err) {
            console.error("Command Error:", err);
            alert("ไม่สามารถส่งคำสั่งไปที่ Server ได้ กรุณาเช็คการรัน ngrok และ node server.js");
        }
    }

    async function fetchMetrics() {
        try {
            const res = await fetch(`${SERVER_URL}/metrics`, {
                headers: { 'ngrok-skip-browser-warning': 'true' }
            });
            const data = await res.json();
            updateUI(data);
        } catch (err) {
            console.error("Fetch Error:", err);
            document.getElementById('lastErr').innerText = "Connection Failed";
        }
    }

    function updateUI(data) {
        // อัปเดตสถานะปุ่ม/ป้าย
        const badge = document.getElementById('statusBadge');
        const dot = document.getElementById('statusDot');
        const text = document.getElementById('statusText');

        if (data.isRunning) {
            badge.className = "status-badge status-running";
            dot.innerText = "🟢";
            text.innerText = "บอทกำลังทำงาน (RUNNING)";
        } else {
            badge.className = "status-badge status-stopped";
            dot.innerText = "🔴";
            text.innerText = "ปิดการทำงาน (STOPPED)";
        }

        // อัปเดตตัวเลข
        if (data.profit !== undefined) {
            const profitEl = document.getElementById('totalProfit');
            const p = parseFloat(data.profit);
            profitEl.innerText = (p >= 0 ? "+" : "") + "$" + p.toFixed(2);
            profitEl.className = "metric-value " + (p >= 0 ? "profit-positive" : "profit-negative");
        }

        if (data.step !== undefined && data.maxStep !== undefined) {
            document.getElementById('martStep').innerText = `${data.step} / ${data.maxStep}`;
        }

        if (data.nextLot !== undefined) {
            document.getElementById('nextLot').innerText = parseFloat(data.nextLot).toFixed(2);
        }

        if (data.lastError) {
            document.getElementById('lastErr').innerText = data.lastError;
        }

        const now = new Date();
        document.getElementById('lastUpdate').innerText = now.toTimeString().split(' ')[0];
    }

    // ดึงข้อมูลทุกๆ 2 วินาที
    setInterval(fetchMetrics, 2000);
    fetchMetrics();
</script>

</body>
</html>
