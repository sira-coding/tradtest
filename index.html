<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EA Remote Control Panel</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #121212; color: #fff; padding-top: 50px; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        button { padding: 15px 25px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; margin: 10px; cursor: pointer; }
        .btn-start { background: #28a745; color: white; }
        .btn-stop { background: #dc3545; color: white; }
        #status { font-size: 20px; font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>EA Remote Control</h2>
        <div id="status">กำลังเชื่อมต่อ...</div>
        <button class="btn-start" onclick="sendCmd('START')">▶ START</button>
        <button class="btn-stop" onclick="sendCmd('STOP')">⏹ STOP</button>
    </div>

    <script>
        // ใช้ Static Domain ถาวรของคุณเรียบร้อยแล้ว
        const SERVER_URL = "https://equinox-swipe-jelly.ngrok-free.dev"; 

        function checkStatus() {
            fetch(`${SERVER_URL}/status`)
                .then(res => res.json())
                .then(data => {
                    const el = document.getElementById("status");
                    el.innerText = data.isRunning ? "🟢 บอทกำลังทำงาน (RUNNING)" : "🔴 บอทหยุดทำงาน (STOPPED)";
                    el.style.color = data.isRunning ? "#28a745" : "#dc3545";
                }).catch(() => {
                    document.getElementById("status").innerText = "⚠️ เชื่อมต่อ Server ไม่ได้";
                });
        }

        function sendCmd(action) {
            fetch(`${SERVER_URL}/control`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action })
            }).then(() => checkStatus());
        }

        setInterval(checkStatus, 3000);
        checkStatus();
    </script>
</body>
</html>
